name: depth-cue-gates

# Enforces the nine refusals from /tmp/depth_cue_audit.md on every PR that
# touches the pinch interaction or its demo surface. Required check — merge
# is blocked unless all three stages (grep / build / XCUITest) pass.

on:
  pull_request:
    paths:
      - 'DotPinchPrototype/Demo/**'
      - 'DotPinchPrototype/Interaction/**'
      - 'DotPinchPrototypeUITests/**'
      - 'scripts/ci/**'
      - '.github/workflows/depth-cue-gates.yml'
  push:
    branches: [main]

concurrency:
  group: depth-cue-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grep-gates:
    name: grep gates (refusals 1-9 static)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/grep_gates.sh

  refusal-xcuitests:
    name: XCUITest refusals (runtime)
    needs: grep-gates
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: Boot iPhone 16 (iOS 18)
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b
      - name: Run gates
        run: bash scripts/ci/run_all_gates.sh
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-xcresult
          path: build/ci-result.xcresult
