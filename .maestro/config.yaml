# Maestro workspace configuration.
# Run: ./scripts/run-maestro.sh   (sets JAVA_HOME=openjdk@17 and --analyze for AI Insights)
#
# Maestro 2.5.1 has a known incompatibility with iOS 26+ simulators (the a11y tree
# returns empty, so assertions fail). All flows here target an iOS 18.0 simulator
# specifically — see scripts/run-maestro.sh which selects iPhone 16 / iOS 18.0
# by UDID.

executionOrder:
  flowsOrder:
    - smoke
    - pinch_in
    - pinch_out
    - mid_flight_reverse
