# Flow 4 — tap-during-cancel-spring (Task 0.3 isQuiet guard)
# Per SSoT 8C: tap mid-cancel-spring should be a no-op post-Phase-0.
# We approximate by starting a cancel (pinch-in from chat-rest) then
# immediately tapping; the post-state should still be cancel-direction.
# Without timing instrumentation we capture three frames at coarse
# intervals and let the diff catch behaviour drift.
appId: com.matthewharrilal.dotpinchprototype
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 4000
- swipe:
    start: "20%,30%"
    end: "45%,50%"
    duration: 400
- tapOn:
    point: "50%,22%"
- takeScreenshot: flow-4-tap-during-cancel-t0
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: flow-4-settled
