# Mid-flight reverse flow — pinch in halfway, then pinch out.
#
# This is THE test for NINETY-pinch-E01 (velocity preservation through target.didSet
# retarget). A correct implementation: trajectory bends smoothly. A Tier 2B
# implementation: trajectory snaps. Visually inspect the screenshots in sequence
# to see the difference.
#
# Note: Maestro's gesture vocabulary doesn't directly support "release mid-gesture
# then re-pinch in the opposite direction without lifting fingers." This flow
# approximates with a quick pinch-in / pinch-out sequence; the human-eye test
# against the screenshots reveals whether the substrate handles it correctly.
appId: com.matthewharrilal.dotpinchprototype
tags:
  - pinch
  - velocity
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- takeScreenshot: midflight_00_start
- pinchIn
# Capture mid-state quickly before the spring settles
- takeScreenshot: midflight_01_after_pinchin
- pinchOut
- takeScreenshot: midflight_02_after_reverse
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: midflight_03_settled
# Expectation: the final state is fullscreen (the OUT gesture wins). Visual check
# the intermediate screenshots for trajectory shape — bent (Tier 3) vs snapped
# (Tier 2B).
- assertVisible:
    id: "ConversationSurface"
