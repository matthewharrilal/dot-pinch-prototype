# Pinch-IN flow — collapse fullscreen conversation into Today slot.
#
# Tests:
#   - Criterion 1: gesture-continuous tracking during pinch (not canned)
#   - Criterion 3: velocity injection on release (status label stays "morphing"
#                  briefly after fingers up, then settles)
#   - Criterion 4: slot-anchored expansion (final bounds match the slot guide)
#   - Criterion 5: identity preserved (ConversationSurface element remains
#                  hittable AND visible at the collapsed size)
appId: com.matthewharrilal.dotpinchprototype
tags:
  - pinch
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- assertVisible:
    id: "ConversationSurface"
- takeScreenshot: pinch_in_00_before
# Maestro's pinchIn is a two-finger inward pinch at viewport center.
- pinchIn
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: pinch_in_01_after
# Identity preservation — the same view exists in both states.
- assertVisible:
    id: "ConversationSurface"
- assertVisible:
    id: "TodaySlotGuide"
