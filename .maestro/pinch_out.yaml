# Pinch-OUT flow — expand collapsed conversation back to fullscreen.
#
# Tests:
#   - Reverse-direction parity (the OUT direction must work as cleanly as IN)
#   - The slot-anchored expansion (per trajectory verdict: today_card top_y fixed
#     at ~394, bottom_y grows 515 → 809; equivalent here: bounds.minY stable,
#     bounds.height grows)
appId: com.matthewharrilal.dotpinchprototype
tags:
  - pinch
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
# First collapse, so we can test expansion.
- pinchIn
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: pinch_out_00_collapsed
# Now expand.
- pinchOut
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: pinch_out_01_fullscreen
- assertVisible:
    id: "ConversationSurface"
