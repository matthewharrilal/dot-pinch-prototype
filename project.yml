# XcodeGen project specification.
# Regenerate the .xcodeproj with: xcodegen generate
#
# iOS deployment target is 17.0 — required for Maestro 2.5.1 compatibility
# (iOS 26+ simulators return an empty a11y tree to Maestro and tests fail).
# Run Maestro flows against an iOS 18.0 simulator specifically.

name: DotPinchPrototype

options:
  bundleIdPrefix: com.matthewharrilal
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  xcodeVersion: "26.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DotPinchPrototype:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DotPinchPrototype
        type: group
        excludes:
          - "**/README.md"
          - "**/.gitkeep"
    info:
      path: DotPinchPrototype/Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewharrilal.dotpinchprototype
        PRODUCT_NAME: DotPinchPrototype
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO

  DotPinchPrototypeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        type: group
        excludes:
          - "**/README.md"
          - "**/.gitkeep"
    dependencies:
      - target: DotPinchPrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewharrilal.dotpinchprototype.tests
        PRODUCT_NAME: DotPinchPrototypeTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
